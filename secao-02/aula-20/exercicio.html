<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício</title>
</head>
<body>
  <form class="form" action="" method="get">
    <p>
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" class="nome">
    </p>
    <p>
      <label for="sobrenome">Sobrenome:</label>
      <input type="text" id="sobrenome" name="sobrenome" class="sobrenome">
    </p>
    <p>
      <label for="peso">Peso:</label>
      <input type="number" id="peso" name="peso" class="peso">
    </p>
    <p>
      <label for="altura">Altura:</label>
      <input type="number" id="altura" name="altura" class="altura">
    </p>
    <p>
      <button type="submit">Enviar</button>
    </p>
  </form>
  <div class="resultado"></div>
  <!-- DEVE FICAR EMBAIXO NO BODY -->
  <script src="js/exercicio.js"></script>
</body>
</html>

<!-- TUDO que acontece no navegador é um "evento", como gatilhos -->
