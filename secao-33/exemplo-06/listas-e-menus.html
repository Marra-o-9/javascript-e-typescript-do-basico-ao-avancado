<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listas e Menus</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    nav {
      background: blanchedalmond;
      height: 50px;
    }

    /* caminho completo das tag: */
    body nav ul li a {
      color: brown;
      text-decoration: none;
      /* atalho pra fontes de todos os sistemas operacionais */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 10px 20px;
      display: block;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    nav ul {
      /* lista alinhada em linha */
      display: flex;
      list-style: none;
    }
    /* hover - quando se passa o mouse em cima do item */
    nav a:hover {
      background: rgba(0, 0, 0, 0.1); /* r, g, b, opacidade */
    }
  </style>
</head>
<body>
  <!-- Menu de navegação -->
  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Lista não ordenada -->
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>

  <!-- Lista ordenada -->
    <!-- types: a, A (ordenar por letras) i, I (ordenar por romanos) 1 (default) -->
    <!-- start - começa pelo item descrito -->
  <ol type="a", start="h">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ol>

  <!-- Lista de descrição -->
  <dl>
    <dt>Café</dt> <!-- Termo -->
    <dd>dá tremedeira</dd> <!-- Descrição -->
    <dt>Água</dt>
    <dd>hidrata</dd>
  </dl>
</body>
</html>
