<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulários</title>
  <style>

  </style>
</head>
<body>
  <!-- Tag de Formulário -->
   <!-- impossível aninhar formulários -->
  <section>
    <form action="#" method="get" target="_blank"> <!-- action: envia o formulário, method: get ou post, target: abrir em outra janela (somente pra verificar envio do formulário nesse caso) -->
        <h1>Título</h1>
        <fieldset>
          <legend>Descrição</legend>
          <p>
            <label for="nome">Nome:</label>
            <!-- definir tipo do input -->
            <input type="text" id="nome" name="nome" placeholder="Seu nome"> <!-- colocar id e name para o backend, servem como seletores e indicadores -->
            <!-- placeholder é o exemplo de texto dentro da caixa -->
            <!-- value é um placeholder que tem o conteúdo de texto na caixa -->
            <!-- readonly bloqueia a edição do texto -->
            
          </p>
          <p>
            <!-- rótulo do input -->
             <!-- for: direciona para input específico à partir do id -->
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" placeholder="Sua idade">
          </p>
          <p>
            <label for="dev">É um Dev?</label>
            <!-- caixa de marcação -->
            <input type="checkbox" id="dev" name="dev">
          </p>
          <p>
            <!-- botão reset para apagar conteúdo do formulário -->
            <button type="reset">Reset</button>
            <!-- botão submit para enviar -->
            <button type="submit">Enviar</button>
          </p>
        </fieldset>
      </form>
    </section>
</body>
</html>
