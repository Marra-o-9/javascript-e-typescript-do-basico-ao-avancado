<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela IMC</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <section class="container">
    <h1>Tabela IMC</h1>
    <div class="descricao">
      <p>
        <b>IMC</b><br>
        Menos do que 18,5<br>
        Entre 18,5 e 24,9<br>
        Entre 25 e 29,9<br>
        Entre 30 e 34,9<br>
        Entre 35 e 39,9<br>
        Mais do que 40
      </p>
    </div>
    <div class="descricao">
      <p>
        <b>Resultado</b><br>
        Abaixo do peso<br>
        Peso normal<br>
        Sobrepeso<br>
        Obesidade grau 1<br>
        Obesidade grau 2<br>
        Obesidade grau 3
      </p>
    </div>
    <h2>Calcule seu IMC</h2>
    <form class="form" action="" method="post">
      <label for="peso">Peso:</label>
      <input type="text" id="peso" name="peso" class="peso">
      <label for="altura">Altura:</label>
      <input type="text" id="altura" name="altura" class="altura">
      <button type="submit">Enviar</button>
    </form>
    <div class="resultado"></div>
  </section>
  <script src="./assets/js/main.js"></script>
</body>
</html>
